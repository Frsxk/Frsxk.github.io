<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#ffb8bf" />

    <!-- Primary -->
    <title>frxskie is a cutie</title>
    <meta name="description" content="frxskie — developer portfolio. Projects, favorites, and links." />
    <meta name="author" content="frxskie" />

    <!-- Canonical & Open Graph -->
    <link rel="canonical" href="https://frxskie.me/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="frxskie" />
    <meta property="og:title" content="frxskie is a cutie" />
    <meta property="og:description" content="frxskie — developer portfolio. Projects, favorites, and links." />
    <meta property="og:url" content="https://frxskie.me/" />
    <meta property="og:image" content="https://frxskie.me/assets/images/profile.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="frxskie is a cutie" />
    <meta name="twitter:description" content="frxskie — developer portfolio. Projects, favorites, and links." />
    <meta name="twitter:image" content="https://frxskie.me/assets/images/profile.png" />

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />

    <!-- Anti-FOUC theme bootstrap: default dark, stored key 'theme' -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('theme');
        } catch (e) {
          stored = null;
        }
        var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
        var root = document.documentElement;
        root.classList.remove('light', 'dark');
        root.classList.add(theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>frxskie — developer portfolio. This site needs JavaScript enabled to display content. Please enable JavaScript and refresh the page.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
